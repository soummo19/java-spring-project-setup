# KRaft Mode Settings
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9096
controller.listener.names=CONTROLLER
log.dirs=/tmp/kafka-logs

# Listeners
listeners=SSL://0.0.0.0:9095,CONTROLLER://0.0.0.0:9096
advertised.listeners=SSL://localhost:9095
listener.security.protocol.map=SSL:SSL,CONTROLLER:PLAINTEXT
inter.broker.listener.name=SSL

# SSL Configuration (Reusing your fixed certs)
ssl.keystore.location=/etc/kafka/certs/kafka.server.keystore.jks
ssl.keystore.password=password
ssl.key.password=password
ssl.truststore.location=/etc/kafka/certs/kafka.server.truststore.jks
ssl.truststore.password=password
ssl.client.auth=none
ssl.endpoint.identification.algorithm=

# Internal Topics
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1